name: CI Build & Static Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Automated Static Analysis & Build
        run: ./gradlew build --scan --stacktrace
        working-directory: mods/non_identity2_bridge

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: non_identity2_bridge-jar
          path: mods/non_identity2_bridge/build/libs/*.jar
