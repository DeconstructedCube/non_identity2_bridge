plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'checkstyle'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("software.bernie.geckolib")
		}
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	modImplementation files('libs/needsofnature-1.5.11.21.11.jar')
	modImplementation "dev.tocraft:craftedcore-fabric:7.0.0+1.21.11"
	modImplementation "dev.tocraft:walkers-fabric:7.2.7+1.21.11"
}
checkstyle {
	toolVersion = '10.21.4'
	configFile = file("config/checkstyle/checkstyle.xml")
	maxWarnings = 0
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs << "-Xlint:all"
	it.options.compilerArgs << "-Werror"
	it.options.compilerArgs << "-Xlint:-processing"
	it.options.compilerArgs << "-Xlint:-classfile"
}

// 自动静态分析挂载：任何日常编译或打包（compileJava / jar / assemble / build）均自动强制执行静态分析检查
tasks.named('compileJava').configure {
	finalizedBy 'checkstyleMain'
}

tasks.named('jar').configure {
	dependsOn 'checkstyleMain'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
