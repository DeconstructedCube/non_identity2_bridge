tasks.register('checkMixins') {
    group = 'verification'
    description = 'Statically audits all Mixin bytecode against Minecraft 1.21.11 bytecode.'
    dependsOn 'compileJava'

    doLast {
        dev.tocraft.tools.MixinAuditor.audit(project.projectDir, project.name)
    }
}

tasks.named('check').configure {
    dependsOn 'checkMixins'
}
